<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Levô</title>
<!--
  Escura como a tela do motoboy, e nao clara como era.

  A janela do app e escura para nao piscar branco enquanto a pagina carrega.
  Uma tela clara aqui reacendia o mesmo lampejo, e ainda ficava emoldurada de
  preto pelas barras do sistema. As cores sao as do tema escuro em
  src/app/globals.css.
-->
<style>
  :root { color-scheme: dark }
  body{margin:0;display:grid;place-items:center;min-height:100dvh;
       font:16px/1.5 system-ui,-apple-system,sans-serif;background:#110F0C;color:#F4F2EE}
  main{max-width:22rem;padding:2rem;text-align:center}
  h1{font-size:1.15rem;margin:0 0 .75rem}
  p{margin:0;color:#B2ADA5}
</style>
<main>
  <h1>Abra pelo link da loja</h1>
  <p>O dono do estabelecimento manda um link para você por mensagem. Toque nele
     uma vez e o app abre já com a sua rota — depois disso, é só abrir pelo ícone.</p>
</main>
