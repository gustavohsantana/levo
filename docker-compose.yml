services:
  postgres:
    image: postgres:17-alpine
    container_name: giro-postgres
    environment:
      POSTGRES_USER: giro
      POSTGRES_PASSWORD: giro
      POSTGRES_DB: giro
    ports:
      - '5432:5432'
    volumes:
      - giro-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U giro']
      interval: 5s
      timeout: 5s
      retries: 10

  # Roteirizador próprio.
  #
  # Rode `./infra/osrm-prepare.sh` uma vez antes de subir: ele baixa o extract
  # da sua região e faz o pré-processamento. Depois disso a roteirização é
  # local, instantânea, sem rate limit e sem depender de servidor de terceiro —
  # que é o que torna o piloto viável de graça e dentro dos termos de uso.
  osrm:
    image: osrm/osrm-backend:latest
    container_name: giro-osrm
    command: osrm-routed --algorithm mld /data/region.osrm
    ports:
      - '5000:5000'
    volumes:
      - ./infra/osrm-data:/data
    profiles: ['osrm']
    restart: unless-stopped

volumes:
  giro-pgdata:
