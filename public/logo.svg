<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 126 32" width="126" height="32" role="img" aria-label="Levô">
  <!--
    Logotipo do Levô, para uso fora da aplicação: formulário de parceria,
    apresentação, assinatura de e-mail.

    O nome vai em curvas, não em <text>: fora daqui a Instrument Sans não está
    carregada, e um logotipo que troca de fonte conforme a máquina de quem abre
    não é um logotipo. Dentro do produto a marca é o componente React, que usa
    a fonte de verdade e herda a cor do tema.
  -->
